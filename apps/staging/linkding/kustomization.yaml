apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: linkding
resources:
  - ../../base/linkding/
  - cloudflare.yaml
  - tunnel-credentials.yaml
  - linkding-superuser.yaml

patches:
- target:
    kind: Deployment
    name: linkding
  patch: |
    - op: add
      path: /spec/template/spec/containers/0/envFrom
      value:
        - secretRef:
            name: linkding-superuser
